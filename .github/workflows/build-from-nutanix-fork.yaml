name: Build image from a Nutanix fork

on:
  workflow_dispatch:
    inputs:
      preset:
        description: 'Nutanix fork preset to build'
        type: choice
        required: true
        options:
          - cosi-controller
      source-version:
        description: 'Git ref (tag/branch/commit) in the fork to build. MUST contain "nutanix" (e.g. v0.2.2-nutanix.1)'
        type: string
        required: true
      build-args:
        description: 'Optional build arguments in KEY=VALUE format, one per line'
        type: string
        required: false
      platforms:
        description: 'Comma separated list of platforms to build the image for'
        type: string
        default: linux/amd64
      push:
        description: 'Push the image to GHCR'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build_from_nutanix_fork:
    runs-on:
      - self-hosted-nutanix-docker-small
    steps:
      - name: Validate source ref (prevent upstream tag collisions)
        shell: bash
        run: |
          if [[ "${{ inputs.source-version }}" != *nutanix* ]]; then
            echo "source-version must contain 'nutanix' to avoid colliding with upstream image tags. Got: '${{ inputs.source-version }}'" >&2
            exit 1
          fi

      - name: Resolve preset
        id: preset
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.preset }}" in
            cosi-controller)
              owner="nutanix-cloud-native"
              repository="nutanix-cloud-native/container-object-storage-interface"
              dockerfile="controller/Dockerfile"
              image_name="objectstorage-controller"
              ;;
            *)
              echo "Unknown preset: ${{ inputs.preset }}" >&2
              exit 1
              ;;
          esac
          {
            echo "owner=$owner"
            echo "repository=$repository"
            echo "dockerfile=$dockerfile"
            echo "image_name=$image_name"
          } >> "$GITHUB_OUTPUT"

      - name: Get GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GHA_CHECKOUT_APP_ID }}
          private-key: ${{ secrets.GHA_CHECKOUT_APP_PRIVATE_KEY }}
          owner: ${{ steps.preset.outputs.owner }}

      - name: Checkout Nutanix fork
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.preset.outputs.repository }}
          ref: ${{ inputs.source-version }}
          token: ${{ steps.app-token.outputs.token }}
          path: source-repo

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve target image
        id: image
        shell: bash
        run: |
          echo "target_image=ghcr.io/${GITHUB_REPOSITORY}/${{ steps.preset.outputs.image_name }}:${{ inputs.source-version }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7.1.0
        with:
          context: source-repo/
          file: source-repo/${{ steps.preset.outputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          load: ${{ ! inputs.push }}
          tags: ${{ steps.image.outputs.target_image }}
